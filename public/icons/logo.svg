<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado Dorado Premium -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#5B4006" />
    </linearGradient>
    
    <!-- Degradado de Fondo Oscuro Brillante -->
    <radialGradient id="dark-bg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1A1A1E" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Sombra para Elementos Dorados -->
    <filter id="gold-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo Circular Oscuro -->
  <circle cx="256" cy="256" r="240" fill="url(#dark-bg)" stroke="url(#gold-grad)" stroke-width="8" filter="url(#gold-glow)" />
  
  <!-- Círculos Concéntricos Decorativos -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.4" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6" />

  <!-- Grupo del Emblema Central (Tijeras y Navaja Estilizadas) -->
  <g transform="translate(256, 215) scale(0.9)" filter="url(#gold-glow)">
    <!-- Silueta de Barber Pole o Navaja en el centro -->
    <!-- Tijeras Abiertas Elegantemente -->
    <!-- Hoja Izquierda -->
    <path d="M-10,-60 L-3,20 L3,20 L10,-60 Z" fill="url(#gold-grad)" />
    <!-- Hoja Derecha -->
    <path d="M-5,-40 L2,-120 L-2,-120 L-8,-40 Z" fill="url(#gold-grad)" transform="rotate(30)" />
    <path d="M5,-40 L-2,-120 L2,-120 L8,-40 Z" fill="url(#gold-grad)" transform="rotate(-30)" />
    
    <!-- Ojos de las tijeras -->
    <circle cx="-35" cy="50" r="22" fill="none" stroke="url(#gold-grad)" stroke-width="6" />
    <circle cx="35" cy="50" r="22" fill="none" stroke="url(#gold-grad)" stroke-width="6" />
    
    <!-- Puntos de Conexión del Mango -->
    <path d="M-35,28 C-35,28 -20,18 -10,24" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round" />
    <path d="M35,28 C35,28 20,18 10,24" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Tornillo Central de las Tijeras -->
    <circle cx="0" cy="-20" r="6" fill="#000" stroke="url(#gold-grad)" stroke-width="3" />
  </g>

  <!-- Estrellas Premium (Calidad) -->
  <g fill="url(#gold-grad)" filter="url(#gold-glow)">
    <polygon points="256,295 260,305 271,305 262,312 265,322 256,315 247,322 250,312 241,305 252,305" />
    <polygon points="220,300 223,308 232,308 225,314 227,322 220,317 213,322 215,314 208,308 217,308" transform="scale(0.85) translate(45, 20)" />
    <polygon points="292,300 295,308 304,308 297,314 299,322 292,317 285,322 287,314 280,308 289,308" transform="scale(0.85) translate(75, 20)" />
  </g>

  <!-- Banner o Cinta de Texto -->
  <path d="M 80 345 Q 256 385 432 345 L 432 395 Q 256 435 80 395 Z" fill="url(#dark-bg)" stroke="url(#gold-grad)" stroke-width="4" filter="url(#gold-glow)" />

  <!-- Texto "LA CHATA" -->
  <text x="256" y="380" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="28" font-weight="900" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="6" filter="url(#gold-glow)">
    LA CHATA
  </text>
  
  <!-- Subtexto "BARBERIA" -->
  <text x="256" y="424" font-family="'Montserrat', 'Helvetica', 'Arial', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" opacity="0.9">
    EST. 2026
  </text>
</svg>
